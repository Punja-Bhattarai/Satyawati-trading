<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Satyawati Trading &amp; Paints Suppliers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: #f6f2ed;
      color: #1c1c1c;
      min-height: 100vh;
    }
    .container { width: min(1100px, 94%); margin: 0 auto; }
    header.top {
      background: #171717; color: #fff; padding: 14px 0;
    }
    header.top .container { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .top h1 { font-size: 1.05rem; font-weight: 700; }
    .top h1 span { color: #ffd23f; }
    .btn {
      border: none; border-radius: 50px; padding: 10px 20px; font-family: inherit;
      font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: .2s;
    }
    .btn-red { background: #e4002b; color: #fff; }
    .btn-red:hover { background: #b3001f; }
    .btn-dark { background: #e4002b; color: #fff; }
    .btn-ghost { background: rgba(255,255,255,.14); color: #fff; }
    .btn-ghost:hover { background: rgba(255,255,255,.28); }

    /* login */
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-card {
      background: #fff; border-radius: 18px; padding: 40px; width: min(380px, 100%);
      box-shadow: 0 20px 60px rgba(0,0,0,.12); text-align: center;
    }
    .login-card img { height: 40px; margin-bottom: 18px; }
    .login-card h2 { margin-bottom: 6px; font-size: 1.3rem; }
    .login-card p { color: #5b5b5b; font-size: .9rem; margin-bottom: 22px; }
    .login-card input {
      width: 100%; padding: 13px 16px; border: 1px solid #e5dcd2; border-radius: 10px;
      font-family: inherit; font-size: .95rem; margin-bottom: 14px;
    }
    .login-card input:focus { outline: none; border-color: #e4002b; }
    .login-error { color: #b3001f; font-size: .85rem; margin-top: 10px; }

    /* dashboard */
    .hidden { display: none !important; }
    .tabs { display: flex; gap: 10px; margin: 26px 0 20px; flex-wrap: wrap; }
    .tab {
      background: #fff; border: 1px solid #e5dcd2; border-radius: 50px; padding: 10px 22px;
      font-family: inherit; font-weight: 600; cursor: pointer; font-size: .92rem; transition: .2s;
    }
    .tab.active { background: #e4002b; border-color: #e4002b; color: #fff; }
    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.05); }
    .stat strong { display: block; font-size: 1.6rem; color: #e4002b; }
    .stat span { color: #5b5b5b; font-size: .85rem; }
    .panel { background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 4px 18px rgba(0,0,0,.05); margin-bottom: 30px; }
    .panel h3 { margin-bottom: 16px; font-size: 1.05rem; }
    .empty { color: #5b5b5b; padding: 30px; text-align: center; }
    .card-order { border: 1px solid #efe7dd; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .card-order .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .card-order .id { font-weight: 700; }
    .badge { font-size: .72rem; font-weight: 700; padding: 4px 12px; border-radius: 50px; text-transform: uppercase; letter-spacing: .5px; }
    .badge.new { background: #eef2ff; color: #3b5bdb; }
    .badge.confirmed { background: #fff3bf; color: #997404; }
    .badge.completed { background: #d3f9d8; color: #2b8a3e; }
    .badge.cancelled { background: #ffe3e3; color: #c92a2a; }
    .items { color: #5b5b5b; font-size: .88rem; margin-bottom: 10px; }
    .total { font-weight: 700; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
    .actions select {
      padding: 8px 12px; border: 1px solid #e5dcd2; border-radius: 8px; font-family: inherit; font-size: .88rem;
    }
    .actions .del { background: none; border: none; color: #c92a2a; font-weight: 600; cursor: pointer; font-size: .85rem; }
    .msg-card { border: 1px solid #efe7dd; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .msg-card .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
    .msg-card .who { font-weight: 700; }
    .msg-card .sub { color: #e4002b; font-weight: 600; font-size: .9rem; margin: 4px 0; }
    .msg-card .body { color: #5b5b5b; font-size: .9rem; }
    .msg-card .del { background: none; border: none; color: #c92a2a; font-weight: 600; cursor: pointer; }
    .muted { color: #8a817a; font-size: .85rem; }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-wrap" id="loginView">
    <div class="login-card">
      <img src="assets/asian-paints-logo.png" alt="Asian Paints" />
      <h2>Admin Login</h2>
      <p>Satyawati Trading &amp; Paints Suppliers</p>
      <input type="password" id="loginPassword" placeholder="Admin password" />
      <button class="btn btn-red" id="loginBtn" style="width:100%">Login</button>
      <p class="login-error hidden" id="loginError">Incorrect password. Try again.</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden">
    <header class="top">
      <div class="container">
        <h1>Satyawati Trading <span>&amp; Paints Suppliers</span> — Admin</h1>
        <button class="btn btn-ghost" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="container">
      <div class="tabs">
        <button class="tab active" data-tab="orders" id="tabOrdersBtn">Orders</button>
        <button class="tab" data-tab="messages" id="tabMessagesBtn">Enquiries</button>
      </div>

      <div class="stat-row">
        <div class="stat"><strong id="statOrders">0</strong><span>Total Orders</span></div>
        <div class="stat"><strong id="statNew">0</strong><span>New Orders</span></div>
        <div class="stat"><strong id="statRevenue">&#8377;0</strong><span>Revenue</span></div>
        <div class="stat"><strong id="statMsgs">0</strong><span>Enquiries</span></div>
      </div>

      <section class="panel" id="ordersPanel">
        <h3>Orders</h3>
        <div id="ordersList"></div>
      </section>

      <section class="panel hidden" id="messagesPanel">
        <h3>Customer Enquiries</h3>
        <div id="messagesList"></div>
      </section>
    </main>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
